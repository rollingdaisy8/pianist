<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piano Loop Coach V1.1</title>
<style>
:root{
  --bg:#f4f3ef; --card:#fff; --text:#1d1d1b; --muted:#716f69;
  --line:#dedbd4; --accent:#222; --soft:#efede8; --danger:#a53a3a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:1100px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
h1{font-size:25px;margin:0}
.subtitle{font-size:13px;color:var(--muted);margin-top:5px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.stack{display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.section-title{font-size:15px;font-weight:800;margin:0 0 10px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--text)}
textarea{min-height:76px;resize:vertical}
button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;color:var(--text)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.soft{background:var(--soft)}
button.danger{color:var(--danger)}
.small{font-size:12px;color:var(--muted);line-height:1.45}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.song-list,.measure-list,.recordings{display:grid;gap:8px}
.song{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px}
.song.active{outline:2px solid var(--accent);outline-offset:-2px}
.song-title{font-weight:750;font-size:14px}
.song-meta{font-size:12px;color:var(--muted);margin-top:2px}
.video{aspect-ratio:16/9;background:#111;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#aaa}
.video iframe{width:100%;height:100%;border:0}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.measure{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.measure.active{background:var(--soft)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:11px;color:var(--muted)}
.rec{border:1px solid var(--line);border-radius:12px;padding:11px}
.rec.active{outline:2px solid var(--accent);outline-offset:-2px}
.rec audio{width:100%;margin-top:8px}
.wave-wrap{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#faf9f7;padding:8px}
canvas{width:100%;height:120px;display:block}
.notice{font-size:12px;color:var(--muted);line-height:1.5;border:1px dashed var(--line);border-radius:11px;padding:10px;background:#faf9f7}
.status{min-height:18px;font-size:12px;color:var(--muted)}
@media(max-width:820px){.grid{grid-template-columns:1fr}.app{padding:14px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>Piano Loop Coach <span class="badge">V1.1</span></h1>
    <div class="subtitle">YouTube 구간 반복 · 내 연주 녹음 · A/B 번갈아 듣기 · 내 연주 파형</div>
  </div>
  <button id="persistBtn" class="soft">저장 보호 요청</button>
</header>

<div class="grid">
  <aside class="card">
    <div class="section-title">곡 보관함</div>
    <input id="songTitle" placeholder="곡 제목">
    <input id="composer" placeholder="작곡가 (선택)">
    <input id="youtubeUrl" placeholder="YouTube 링크">
    <textarea id="notes" placeholder="연습 메모 (선택)"></textarea>
    <button id="addSong" class="primary">곡 추가</button>

    <hr>
    <div id="songList" class="song-list"></div>
    <div id="libraryStatus" class="status"></div>

    <hr>
    <div class="row">
      <button id="exportBtn">백업</button>
      <button id="importBtn">복원</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>

    <div class="notice" style="margin-top:10px">
      곡·마디·녹음은 이 브라우저에 저장됩니다. 같은 GitHub Pages 주소와 같은 브라우저에서는
      <code>index.html</code>을 새 버전으로 교체해도 유지됩니다. 브라우저 데이터 삭제나 기기 변경 시에는 사라질 수 있습니다.
    </div>
  </aside>

  <main class="stack">
    <section class="card">
      <div class="row" style="justify-content:space-between">
        <div>
          <div id="currentTitle" class="section-title" style="margin:0">곡을 선택하세요</div>
          <div id="currentMeta" class="small"></div>
        </div>
        <button id="deleteSong" class="danger" disabled>곡 삭제</button>
      </div>

      <div id="videoBox" class="video" style="margin-top:12px">곡을 선택하세요</div>

      <div class="row" style="margin-top:10px">
        <button id="playPause" disabled>재생 / 일시정지</button>
        <button id="markStart" disabled>현재 = 마디 시작</button>
        <button id="markEnd" disabled>현재 = 마디 끝</button>
        <span id="timeLabel" class="time">00:00.0</span>
      </div>

      <div class="row" style="margin-top:12px">
        <input id="measureName" placeholder="마디 이름 (예: 1마디, A-3)" style="flex:1;min-width:170px">
        <input id="startSec" type="number" min="0" step="0.1" placeholder="시작 초" style="width:110px">
        <input id="endSec" type="number" min="0" step="0.1" placeholder="끝 초" style="width:110px">
        <button id="saveMeasure" class="primary" disabled>마디 저장</button>
      </div>

      <div id="measureList" class="measure-list" style="margin-top:10px"></div>
    </section>

    <section class="card">
      <div class="section-title">내 연주 녹음 & 비교</div>
      <div class="small" style="margin-bottom:10px">먼저 위에서 연습할 마디를 선택하세요.</div>

      <div class="row">
        <button id="recordBtn" class="primary" disabled>● 내 연주 녹음</button>
        <button id="stopRecordBtn" disabled>■ 녹음 종료</button>
        <button id="playReferenceBtn" disabled>원본 듣기</button>
        <button id="playMyTakeBtn" disabled>내 연주 듣기</button>
        <button id="abBtn" disabled>원본 → 내 연주</button>
      </div>
      <div id="recordStatus" class="status"></div>

      <div id="recordings" class="recordings"></div>
    </section>
  </main>
</div>
</div>

<script>
(() => {
"use strict";

const DB_NAME = "piano-loop-coach-v11";
const DB_VERSION = 1;
const SONGS = "songs";
const RECS = "recordings";

let db = null;
let songs = [];
let currentSong = null;
let selectedMeasureId = null;
let selectedRecordingId = null;

let ytPlayer = null;
let ytReady = false;
let ticker = null;
let looping = false;
let abMode = false;
let abEndTimer = null;

let mediaRecorder = null;
let recordingStream = null;
let chunks = [];

const $ = id => document.getElementById(id);

function uid() {
  return crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(16).slice(2));
}

function fmt(sec) {
  sec = Number.isFinite(+sec) ? Math.max(0, +sec) : 0;
  const m = Math.floor(sec / 60);
  const s = sec - m * 60;
  return `${String(m).padStart(2,"0")}:${s.toFixed(1).padStart(4,"0")}`;
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(SONGS)) {
        d.createObjectStore(SONGS, {keyPath:"id"});
      }
      if (!d.objectStoreNames.contains(RECS)) {
        const r = d.createObjectStore(RECS, {keyPath:"id"});
        r.createIndex("songId", "songId");
        r.createIndex("measureId", "measureId");
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function store(name, mode="readonly") {
  return db.transaction(name, mode).objectStore(name);
}
function getAll(name) {
  return new Promise((resolve,reject)=>{
    const r=store(name).getAll();
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}
function put(name,value) {
  return new Promise((resolve,reject)=>{
    const r=store(name,"readwrite").put(value);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}
function del(name,key) {
  return new Promise((resolve,reject)=>{
    const r=store(name,"readwrite").delete(key);
    r.onsuccess=()=>resolve();
    r.onerror=()=>reject(r.error);
  });
}

function youtubeId(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes("youtu.be")) return u.pathname.slice(1).split("/")[0];
    if (u.hostname.includes("youtube.com")) {
      if (u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2];
      if (u.pathname.startsWith("/embed/")) return u.pathname.split("/")[2];
      return u.searchParams.get("v");
    }
  } catch(e) {}
  return null;
}

function ensureYouTubeAPI() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  return new Promise(resolve => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => {
      if (typeof prev === "function") prev();
      resolve();
    };
    if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
      const s = document.createElement("script");
      s.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(s);
    }
  });
}

async function refreshSongs() {
  songs = await getAll(SONGS);
  if (currentSong) currentSong = songs.find(s => s.id === currentSong.id) || null;
  renderSongs();
}

function renderSongs() {
  const box = $("songList");
  box.innerHTML = "";
  if (!songs.length) {
    box.innerHTML = '<div class="small">아직 저장한 곡이 없습니다.</div>';
    return;
  }
  songs.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  songs.forEach(s => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "song" + (currentSong?.id === s.id ? " active" : "");
    btn.innerHTML = `
      <div class="song-title">${esc(s.title)}</div>
      <div class="song-meta">${esc(s.composer||"")} · ${(s.measures||[]).length}개 구간</div>`;
    btn.addEventListener("click", () => selectSong(s.id));
    box.appendChild(btn);
  });
}

async function selectSong(id) {
  const s = songs.find(x=>x.id===id);
  if (!s) return;

  currentSong = s;
  selectedMeasureId = null;
  selectedRecordingId = null;
  looping = false;
  abMode = false;
  clearTimeout(abEndTimer);
  clearInterval(ticker);

  $("currentTitle").textContent = s.title;
  $("currentMeta").textContent = [s.composer, "YouTube"].filter(Boolean).join(" · ");

  ["deleteSong","playPause","markStart","markEnd","saveMeasure"].forEach(id=>$(id).disabled=false);
  ["recordBtn","playReferenceBtn","playMyTakeBtn","abBtn"].forEach(id=>$(id).disabled=true);

  renderSongs();
  renderMeasures();
  await renderRecordings();

  $("videoBox").innerHTML = '<div id="ytPlayerHost" style="width:100%;height:100%"></div>';
  await ensureYouTubeAPI();

  ytReady = false;
  ytPlayer = new YT.Player("ytPlayerHost", {
    videoId:s.youtubeId,
    playerVars:{playsinline:1,rel:0},
    events:{
      onReady:()=>{
        ytReady=true;
        startTicker();
      }
    }
  });
}

function currentTime() {
  if (!ytPlayer || !ytReady) return 0;
  try { return Number(ytPlayer.getCurrentTime()) || 0; } catch(e) { return 0; }
}

function playYT() {
  if (ytPlayer && ytReady) ytPlayer.playVideo();
}
function pauseYT() {
  if (ytPlayer && ytReady) ytPlayer.pauseVideo();
}
function seekPlay(sec) {
  if (ytPlayer && ytReady) {
    ytPlayer.seekTo(Number(sec), true);
    ytPlayer.playVideo();
  }
}

function startTicker() {
  clearInterval(ticker);
  ticker = setInterval(() => {
    const t = currentTime();
    $("timeLabel").textContent = fmt(t);

    const m = currentSong?.measures?.find(x=>x.id===selectedMeasureId);
    if (looping && m && t >= Number(m.end) - 0.03) {
      seekPlay(m.start);
    }
  }, 90);
}

function renderMeasures() {
  const box = $("measureList");
  box.innerHTML = "";
  const arr = currentSong?.measures || [];
  if (!arr.length) {
    box.innerHTML = '<div class="small">아직 저장한 마디/구간이 없습니다.</div>';
    return;
  }

  arr.forEach((m,i)=>{
    const el=document.createElement("div");
    el.className="measure"+(selectedMeasureId===m.id?" active":"");
    el.innerHTML=`
      <button type="button" class="playMeasure">▶</button>
      <div>
        <b>${esc(m.name || `${i+1}마디`)}</b>
        <div class="small">${fmt(m.start)} → ${fmt(m.end)} · ${(m.end-m.start).toFixed(1)}초</div>
      </div>
      <button type="button" class="danger deleteMeasure">×</button>
    `;
    el.querySelector(".playMeasure").addEventListener("click",()=>selectMeasure(m.id,true));
    el.querySelector(".deleteMeasure").addEventListener("click",()=>deleteMeasure(m.id));
    box.appendChild(el);
  });
}

async function selectMeasure(id, play=false) {
  selectedMeasureId = id;
  selectedRecordingId = null;
  looping = true;
  abMode = false;
  clearTimeout(abEndTimer);

  renderMeasures();
  await renderRecordings();

  $("recordBtn").disabled = false;
  $("playReferenceBtn").disabled = false;
  $("playMyTakeBtn").disabled = true;
  $("abBtn").disabled = true;

  if (play) {
    const m=currentSong.measures.find(x=>x.id===id);
    seekPlay(m.start);
  }
}

async function deleteMeasure(id) {
  if (!currentSong) return;
  currentSong.measures = (currentSong.measures||[]).filter(m=>m.id!==id);
  currentSong.updatedAt = Date.now();

  const recs = await getAll(RECS);
  for (const r of recs.filter(r=>r.songId===currentSong.id && r.measureId===id)) {
    await del(RECS,r.id);
  }

  if (selectedMeasureId === id) {
    selectedMeasureId = null;
    selectedRecordingId = null;
    looping = false;
  }

  await put(SONGS,currentSong);
  await refreshSongs();
  renderMeasures();
  await renderRecordings();
}

async function renderRecordings() {
  const box = $("recordings");
  box.innerHTML = "";

  if (!currentSong || !selectedMeasureId) {
    box.innerHTML='<div class="small">마디를 선택하면 해당 구간의 녹음이 표시됩니다.</div>';
    return;
  }

  const all = await getAll(RECS);
  const arr = all
    .filter(r=>r.songId===currentSong.id && r.measureId===selectedMeasureId)
    .sort((a,b)=>b.createdAt-a.createdAt);

  if (!arr.length) {
    box.innerHTML='<div class="small">아직 이 마디의 녹음이 없습니다.</div>';
    return;
  }

  if (!selectedRecordingId) selectedRecordingId = arr[0].id;

  for (const [idx,r] of arr.entries()) {
    const el = document.createElement("div");
    el.className = "rec" + (selectedRecordingId===r.id ? " active" : "");

    const url = URL.createObjectURL(r.blob);
    el.innerHTML = `
      <div class="row" style="justify-content:space-between">
        <div>
          <b>Take ${arr.length-idx}</b>
          <div class="small">${new Date(r.createdAt).toLocaleString()}</div>
        </div>
        <div class="row">
          <button type="button" class="selectTake">선택</button>
          <button type="button" class="danger deleteTake">삭제</button>
        </div>
      </div>
      <audio controls preload="metadata"></audio>
      <div class="wave-wrap">
        <canvas width="900" height="160" aria-label="내 연주 파형"></canvas>
      </div>
    `;

    const audio = el.querySelector("audio");
    audio.src = url;
    el.querySelector(".selectTake").addEventListener("click",()=>{
      selectedRecordingId=r.id;
      renderRecordings();
      $("playMyTakeBtn").disabled=false;
      $("abBtn").disabled=false;
    });
    el.querySelector(".deleteTake").addEventListener("click",async()=>{
      await del(RECS,r.id);
      if(selectedRecordingId===r.id) selectedRecordingId=null;
      URL.revokeObjectURL(url);
      await renderRecordings();
      updateCompareButtons();
    });

    box.appendChild(el);
    drawWaveform(r.blob, el.querySelector("canvas"));
  }

  updateCompareButtons();
}

function updateCompareButtons() {
  const ok = !!selectedRecordingId && !!selectedMeasureId;
  $("playMyTakeBtn").disabled = !ok;
  $("abBtn").disabled = !ok;
}

async function drawWaveform(blob, canvas) {
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);

  try {
    const arr = await blob.arrayBuffer();
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const buffer = await ac.decodeAudioData(arr.slice(0));
    const data = buffer.getChannelData(0);

    const width = canvas.width;
    const height = canvas.height;
    const mid = height/2;
    const samplesPerPixel = Math.max(1, Math.floor(data.length/width));

    ctx.lineWidth = 1;
    ctx.strokeStyle = "#222";
    ctx.beginPath();

    for(let x=0;x<width;x++){
      const start=x*samplesPerPixel;
      const end=Math.min(data.length,start+samplesPerPixel);
      let min=1,max=-1;
      for(let i=start;i<end;i++){
        const v=data[i];
        if(v<min)min=v;
        if(v>max)max=v;
      }
      const y1=mid+min*mid*0.86;
      const y2=mid+max*mid*0.86;
      ctx.moveTo(x,y1);
      ctx.lineTo(x,y2);
    }
    ctx.stroke();

    ctx.strokeStyle="#bbb";
    ctx.beginPath();
    ctx.moveTo(0,mid);
    ctx.lineTo(width,mid);
    ctx.stroke();

    ac.close();
  } catch(e) {
    ctx.fillStyle="#777";
    ctx.font="16px sans-serif";
    ctx.fillText("파형을 표시할 수 없습니다.",20,30);
  }
}

async function startRecording() {
  if (!selectedMeasureId) return;

  try {
    recordingStream = await navigator.mediaDevices.getUserMedia({
      audio:{
        echoCancellation:false,
        noiseSuppression:false,
        autoGainControl:false
      }
    });

    chunks = [];
    mediaRecorder = new MediaRecorder(recordingStream);

    mediaRecorder.ondataavailable = e => {
      if (e.data.size) chunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      const blob = new Blob(chunks,{type:mediaRecorder.mimeType || "audio/webm"});
      const rec = {
        id:uid(),
        songId:currentSong.id,
        measureId:selectedMeasureId,
        createdAt:Date.now(),
        blob
      };
      await put(RECS,rec);
      selectedRecordingId = rec.id;

      recordingStream.getTracks().forEach(t=>t.stop());
      recordingStream = null;

      $("recordBtn").disabled=false;
      $("stopRecordBtn").disabled=true;
      $("recordStatus").textContent="녹음 저장 완료";
      await renderRecordings();
    };

    mediaRecorder.start();
    $("recordBtn").disabled=true;
    $("stopRecordBtn").disabled=false;
    $("recordStatus").textContent="녹음 중…";
  } catch(e) {
    $("recordStatus").textContent="마이크 권한을 사용할 수 없습니다. GitHub Pages(HTTPS)에서 마이크 권한을 허용해 주세요.";
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
}

async function getSelectedRecording() {
  if (!selectedRecordingId) return null;
  const all = await getAll(RECS);
  return all.find(r=>r.id===selectedRecordingId) || null;
}

async function playMyTake() {
  const rec = await getSelectedRecording();
  if (!rec) return;
  looping = false;
  pauseYT();
  const url = URL.createObjectURL(rec.blob);
  const a = new Audio(url);
  a.onended = () => URL.revokeObjectURL(url);
  a.play();
}

function playReferenceOnce(onDone=null) {
  const m=currentSong?.measures?.find(x=>x.id===selectedMeasureId);
  if (!m) return;

  looping=false;
  seekPlay(m.start);
  clearTimeout(abEndTimer);

  const duration=Math.max(0.1,(m.end-m.start))*1000;
  abEndTimer=setTimeout(()=>{
    pauseYT();
    if(typeof onDone==="function") onDone();
  },duration);
}

async function playAB() {
  const rec=await getSelectedRecording();
  const m=currentSong?.measures?.find(x=>x.id===selectedMeasureId);
  if(!rec||!m) return;

  abMode=true;
  $("recordStatus").textContent="A/B 비교: 원본 재생 중";
  playReferenceOnce(async()=>{
    if(!abMode) return;
    $("recordStatus").textContent="A/B 비교: 내 연주 재생 중";
    await new Promise(r=>setTimeout(r,600));
    const url=URL.createObjectURL(rec.blob);
    const a=new Audio(url);
    a.onended=()=>{
      URL.revokeObjectURL(url);
      $("recordStatus").textContent="A/B 비교 완료";
      abMode=false;
    };
    a.play();
  });
}

async function requestPersistence() {
  if (!navigator.storage?.persist) {
    $("libraryStatus").textContent="이 브라우저에서는 저장 보호 요청을 지원하지 않습니다.";
    return;
  }
  const granted=await navigator.storage.persist();
  $("libraryStatus").textContent=granted ? "저장 보호 요청이 허용되었습니다." : "저장 보호가 허용되지 않았습니다.";
}

async function exportBackup() {
  const songData = await getAll(SONGS);
  const recData = await getAll(RECS);

  const recsSerialized = [];
  for (const r of recData) {
    const base64 = await blobToDataURL(r.blob);
    recsSerialized.push({...r, blobDataUrl:base64, blob:undefined});
  }

  const payload={
    app:"Piano Loop Coach V1.1",
    exportedAt:new Date().toISOString(),
    songs:songData,
    recordings:recsSerialized
  };

  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="piano-loop-coach-v11-backup.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function blobToDataURL(blob) {
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>resolve(fr.result);
    fr.onerror=()=>reject(fr.error);
    fr.readAsDataURL(blob);
  });
}

async function dataURLToBlob(dataUrl) {
  const res=await fetch(dataUrl);
  return await res.blob();
}

async function importBackup(file) {
  try {
    const obj=JSON.parse(await file.text());
    if(!Array.isArray(obj.songs)) throw new Error("올바른 백업 파일이 아닙니다.");

    for(const s of obj.songs) await put(SONGS,s);

    if(Array.isArray(obj.recordings)) {
      for(const r of obj.recordings) {
        if(!r.blobDataUrl) continue;
        const blob=await dataURLToBlob(r.blobDataUrl);
        const rec={...r,blob};
        delete rec.blobDataUrl;
        await put(RECS,rec);
      }
    }

    await refreshSongs();
    $("libraryStatus").textContent="백업 복원 완료";
  } catch(e) {
    $("libraryStatus").textContent="복원 실패: "+e.message;
  }
}

$("addSong").addEventListener("click",async()=>{
  const title=$("songTitle").value.trim();
  const id=youtubeId($("youtubeUrl").value.trim());

  if(!title||!id) {
    alert("곡 제목과 올바른 YouTube 링크를 입력해 주세요.");
    return;
  }

  const s={
    id:uid(),
    title,
    composer:$("composer").value.trim(),
    notes:$("notes").value.trim(),
    youtubeId:id,
    measures:[],
    createdAt:Date.now(),
    updatedAt:Date.now()
  };

  await put(SONGS,s);
  ["songTitle","composer","youtubeUrl","notes"].forEach(id=>$(id).value="");
  await refreshSongs();
  selectSong(s.id);
});

$("deleteSong").addEventListener("click",async()=>{
  if(!currentSong) return;
  if(!confirm(`"${currentSong.title}"을 삭제할까요?`)) return;

  const all=await getAll(RECS);
  for(const r of all.filter(x=>x.songId===currentSong.id)) await del(RECS,r.id);
  await del(SONGS,currentSong.id);

  currentSong=null;
  selectedMeasureId=null;
  selectedRecordingId=null;
  looping=false;
  clearInterval(ticker);
  clearTimeout(abEndTimer);

  $("currentTitle").textContent="곡을 선택하세요";
  $("currentMeta").textContent="";
  $("videoBox").textContent="곡을 선택하세요";
  ["deleteSong","playPause","markStart","markEnd","saveMeasure","recordBtn","playReferenceBtn","playMyTakeBtn","abBtn"].forEach(id=>$(id).disabled=true);

  await refreshSongs();
  renderMeasures();
  renderRecordings();
});

$("playPause").addEventListener("click",()=>{
  if(!ytReady)return;
  looping=false;
  ytPlayer.getPlayerState()===1 ? pauseYT() : playYT();
});

$("markStart").addEventListener("click",()=>{
  $("startSec").value=currentTime().toFixed(1);
});

$("markEnd").addEventListener("click",()=>{
  $("endSec").value=currentTime().toFixed(1);
});

$("saveMeasure").addEventListener("click",async()=>{
  if(!currentSong)return;

  const start=Number($("startSec").value);
  const end=Number($("endSec").value);

  if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start) {
    alert("끝 시간은 시작 시간보다 커야 합니다.");
    return;
  }

  currentSong.measures=currentSong.measures||[];
  currentSong.measures.push({
    id:uid(),
    name:$("measureName").value.trim() || `${currentSong.measures.length+1}마디`,
    start,
    end
  });
  currentSong.updatedAt=Date.now();

  await put(SONGS,currentSong);
  $("measureName").value="";
  $("startSec").value="";
  $("endSec").value="";
  await refreshSongs();
  renderMeasures();
});

$("recordBtn").addEventListener("click",startRecording);
$("stopRecordBtn").addEventListener("click",stopRecording);
$("playReferenceBtn").addEventListener("click",()=>playReferenceOnce());
$("playMyTakeBtn").addEventListener("click",playMyTake);
$("abBtn").addEventListener("click",playAB);
$("persistBtn").addEventListener("click",requestPersistence);
$("exportBtn").addEventListener("click",exportBackup);
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",e=>{
  if(e.target.files[0]) importBackup(e.target.files[0]);
});

(async()=>{
  try{
    db=await openDB();
    await refreshSongs();
    $("libraryStatus").textContent="저장소 준비 완료";
  }catch(e){
    $("libraryStatus").textContent="저장소 초기화 실패: "+e.message;
  }
})();
})();
</script>
